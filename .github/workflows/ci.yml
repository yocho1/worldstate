name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check backend/

  tests:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - name: Run unit tests
        working-directory: backend
        run: pytest -m "not integration"

  compose-smoke:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start all services
        run: docker compose up -d --build
      - name: Wait for all services to be healthy
        run: |
          deadline=$((SECONDS+300))
          while [ $SECONDS -lt $deadline ]; do
            all_healthy=1
            for svc in postgres neo4j redis api; do
              health="$(docker inspect --format '{{.State.Health.Status}}' worldstate-$svc 2>/dev/null || echo missing)"
              echo "$svc: $health"
              [ "$health" != "healthy" ] && all_healthy=0
            done
            [ "$all_healthy" -eq 1 ] && { echo "All services healthy."; exit 0; }
            sleep 10
          done
          echo "Timed out waiting for healthy services."
          docker compose logs --tail=100
          exit 1
      - name: Check API health endpoint
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8000/health | grep -q '"status":"ok"'
      - name: Tear down
        if: always()
        run: docker compose down -v
